name: 每日更新與發布 Stock Lens

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/data/**'
      - 'docs/**'
  schedule:
    # 台灣時間 18:20；GitHub 排程可能延後。
    - cron: '20 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: stock-lens-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      update_outcome: ${{ steps.update.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 檢查資料處理與前端邏輯
        run: |
          python -m unittest discover -s tests -v
          node --test tests/app.test.cjs
      - name: 取得每日資料；失敗仍發布舊資料與狀態
        id: update
        continue-on-error: true
        env:
          STOCK_LENS_CSV_URL: ${{ secrets.STOCK_LENS_CSV_URL }}
        run: python update_snapshot.py
      - name: 驗證並產生全市場公司研究索引
        run: python build_research.py
      - name: 更新近期漲跌排行與交易日歷史
        continue-on-error: true
        run: python market_movers.py
      - name: 更新法說會、股東會與公司摘要待辦
        continue-on-error: true
        run: python company_calendar.py
      - name: 保留有變更的快照、CSV 與更新狀態
        run: |
          if ! git diff --quiet -- site/data || test -n "$(git ls-files --others --exclude-standard site/data)"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add site/data
            git commit -m 'data: 更新上市台股快照與來源狀態'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: 壓縮網站資料，減少手機下載量
        run: |
          python - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path
          for name in ('stocks', 'company-research', 'market-movers', 'company-calendar'):
              path = Path('site/data') / (name + '.json')
              path.with_suffix('.json.gz').write_bytes(gzip.compress(path.read_bytes(), compresslevel=6, mtime=0))
          payload = json.loads(Path('site/data/company-research.json').read_text())
          folder = Path('site/data/research-companies')
          folder.mkdir(exist_ok=True)
          index = {}
          for symbol, profile in payload['profiles'].items():
              raw = json.dumps(profile, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode()
              name = hashlib.sha256(raw).hexdigest() + '.json'
              (folder / name).write_bytes(raw)
              (folder / (name + '.gz')).write_bytes(gzip.compress(raw, compresslevel=6, mtime=0))
              overview = profile.get('overview') or {}
              entries = []
              for label, key in [('公司業務', 'business'), ('發展方向', 'direction'), ('獲利來源', 'profit_mechanism')]:
                  if overview.get(key): entries.append({'label': label, 'text': overview[key]})
              for item in overview.get('outlooks', []):
                  entries.append({'label': '未來財務與發展方向', 'text': '；'.join(str(item.get(k) or '') for k in ('type', 'scope', 'limitations'))})
              for item in overview.get('events', []):
                  entries.append({'label': '事件與進度', 'text': '；'.join(str(item.get(k) or '') for k in ('type', 'status', 'text'))})
              for key in ('business', 'earnings', 'transition', 'developments'):
                  if profile.get(key): entries.append({'label': '官方摘要・' + key, 'text': profile[key]['text']})
              brief = {k: profile.get(k) for k in ('name', 'status', 'reviewed_at', 'research_completion', 'calculated_metrics')}
              brief.update({'sources': {}, 'limitations': [], '_detail_path': 'research-companies/' + name, 'search_entries': entries})
              if overview:
                  brief['overview'] = {k: str(overview.get(k) or '') for k in ('source_reviewed_at', 'imported_at', 'source_filename', 'status', 'screening')}
                  brief['overview'].update({'business': '', 'direction': '', 'summary': '', 'urls': [], 'events': [], 'outlooks': []})
                  rolling = (overview.get('financial') or {}).get('rolling') or {}
                  brief['overview']['financial'] = {'rolling': {k: rolling.get(k) for k in ('period', 'ttm_eps', 'ttms', 'formula')}}
              index[symbol] = brief
          compact = {k: v for k, v in payload.items() if k != 'profiles'}
          compact['profiles'] = index
          raw = json.dumps(compact, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode()
          Path('site/data/research-index.json').write_bytes(raw)
          Path('site/data/research-index.json.gz').write_bytes(gzip.compress(raw, compresslevel=6, mtime=0))
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
  report:
    needs: [build, deploy]
    if: always() && needs.build.outputs.update_outcome == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '官方資料更新失敗或部分失敗。已嘗試發布上次有效資料與失敗狀態；請查看 build 與 deploy。'
          exit 1
